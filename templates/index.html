<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Organizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.1em;
        }



        label.toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        label.toggle-row span {
            font-weight: 600;
            color: #333;
        }

        .ai-section {
            border: 1px solid #e1e5e9;
            border-radius: 12px;
            padding: 20px;
            background: #f8f9ff;
            margin-top: 10px;
            display: none;
        }

        .ai-section.active {
            display: block;
        }

        .hint {
            color: #666;
            font-size: 0.9em;
            margin-top: 8px;
        }

        .chat-message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            line-height: 1.4;
        }

        .chat-message.bot {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }

        .chat-message.user {
            background: #f3e5f5;
            border-left: 4px solid #9c27b0;
            margin-left: 20px;
        }

        .chat-message.system {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            font-style: italic;
        }

        .text-input,
        .select-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s ease;
            background: #fff;
        }

        .text-input:focus,
        .select-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .folder-input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .folder-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .folder-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .browse-btn {
            padding: 15px 20px;
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .browse-btn:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .organize-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .organize-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .organize-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .folder-browser {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .folder-browser-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .folder-browser-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
            padding: 5px;
        }

        .current-path {
            font-family: monospace;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            word-break: break-all;
            font-size: 0.9em;
        }

        .folder-list {
            list-style: none;
        }

        .folder-item {
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .folder-item:hover {
            background: #f8f9fa;
        }

        .folder-item.parent {
            color: #666;
            font-style: italic;
        }

        .select-folder-btn {
            width: 100%;
            padding: 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .select-folder-btn:hover {
            background: #218838;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 File Organizer Chat</h1>
            <p>Chat to organize files and ask questions</p>
        </div>

        <div id="chatContainer" style="max-height: 400px; overflow-y: auto; border: 1px solid #e1e5e9; border-radius: 10px; padding: 20px; margin-bottom: 20px; background: #f8f9ff;">
            <div id="chatMessages">
                <div class="chat-message bot">
                    <strong>🤖 Assistant:</strong> Hi! I can help you organize files and answer questions. Try commands like:
                    <br>• "organize my downloads"
                    <br>• "organize C:\Users\Downloads with AI"
                    <br>• "how many files were processed?"
                    <br>• "what files did AI move?"
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="chatInput" class="text-input"
                   placeholder="Type your message... (e.g., 'organize my downloads' or 'how many files processed?')"
                   style="flex: 1;">
            <button type="button" class="browse-btn" onclick="sendMessage()" id="sendBtn">
                💬 Send
            </button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, type = 'bot', sender = '🤖 Assistant') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${type}`;
            messageDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatMessages.appendChild(messageDiv);

            // Auto-scroll to bottom
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, 'user', '👤 You');
            chatInput.value = '';

            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading"></span> Thinking...';

            try {
                // Check if it's an organize command
                if (message.toLowerCase().includes('organize')) {
                    await handleOrganizeCommand(message);
                } else {
                    // Treat as a question
                    await handleQuestion(message);
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`, 'system', '⚠️ System');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '💬 Send';
            }
        }

        async function handleOrganizeCommand(message) {
            // Extract folder path or use default
            let folderPath = {{ default_folder|tojson }};
            const pathMatch = message.match(/organize\s+([^\s]+)/i);
            if (pathMatch) {
                folderPath = pathMatch[1];
                if (folderPath === 'my' || folderPath === 'downloads') {
                    folderPath = {{ default_folder|tojson }};
                }
            }

            addMessage(`Organizing files in: ${folderPath}`, 'system', '🔄 System');

            const formData = new FormData();
            formData.append('folder_path', folderPath);

            // Use AI if mentioned in message
            const useAI = message.toLowerCase().includes('ai') || message.toLowerCase().includes('smart');
            if (useAI) {
                formData.append('ai_provider', '{{ active_ai_provider or "openai" }}');
                formData.append('ai_scope', 'fallback');
            }

            const response = await fetch('/organize', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            if (result.success) {
                addMessage(result.message, 'system', '✅ Success');
            } else {
                addMessage(result.error || 'Organization failed', 'system', '❌ Error');
            }
        }

        async function handleQuestion(question) {
            const response = await fetch('/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ question: question })
            });

            const result = await response.json();
            if (result.success) {
                addMessage(result.answer, 'bot');
            } else {
                addMessage(result.error || 'Failed to get answer', 'system', '❌ Error');
            }
        }

        // Allow Enter key to send message
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
